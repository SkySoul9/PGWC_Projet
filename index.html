<!DOCTYPE html>
<html lang="fr">
    <meta charset="UTF-8">
    <head>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <title>Projet</title>
    </head>
    <body>
        <div> 
            <h1> La Météo à Blois </h1>
            <input type="checkbox" id="cbTempMax" name="temp" value="pTempMax" onchange = "coche(0);"/>
            <label for="cbTempMax">Température Max </label>
        
            <input type="checkbox" id="cbTempMin" name="temp" value = "pTempMin" onchange = "coche(1);" />
            <label for="cbTempMin">Température Minimum </label>

            <input type="checkbox" id="cbTempActuel" name="temp" value="tempActuel" onchange = "coche(2);" />
            <label for="cbTempActuel">Température Actuel </label>
        </div>

        <div>
            <label for="choixHeure">Choisissez l'heure a laquel vous voulez savoir la température</label>
            <input type="text" placeholder="Entrez une valeur ici" id="choixHeure" />
            <button type="button" onclick="getHeure();">Afficher</button>
        </div>
        <div>
            <h1>Affichage courbe température future journée </h1>

            <canvas id="tempFuture" ></canvas>
        </div>

        <div> 
            <h1>Météo a un endroit précis d'apres météo France</h1>
            <label for="latitude"> Latitude : </label>
            <input type="text" placeholder="Exemple : 47.587947" id="latitude"/>
            <label for="longitude"> Longitude : </label>
            <input type="text" placeholder="Exemple : 1.337621" id="longitude"/>
            <label for="place" > Nom de la localisation</label>
            <input type="text" placeholder="Exemple : Blois" id="place"/>
            <button type = "button" onclick="getMeteoActuel();">Meteo Actuel</button>
        </div>

        <div>
            <h1>Recherche par nom de lieu</h1>
            <label for="locationName">Nom : </label>
            <input type="text" placeholder="Exemple : Blois" id="locationName" />
            <button type="button" onclick="searchLocationByName();">Rechercher</button>
            <button type="button" onclick="displayWeatherForAllSaved();">Afficher météo de tous les lieux enregistrés</button>
        </div>

        <div>
            <h1>Filtrer par Box / Région</h1>
            <label for="minLatitude">Lat min :</label>
            <input type="text" id="minLatitude" placeholder="47.0" />
            <label for="maxLatitude">Lat max :</label>
            <input type="text" id="maxLatitude" placeholder="48.0" />
            <label for="minLongitude">Lon min :</label>
            <input type="text" id="minLongitude" placeholder="0.5" />
            <label for="maxLongitude">Lon max :</label>
            <input type="text" id="maxLongitude" placeholder="2.0" />
            <button type="button" onclick="filterLocationsByBBox();">Filtrer par bounding box</button>
            <p></p>
            <label for="regionName">Département / Région :</label>
            <input type="text" id="regionName" placeholder="Centre-Val de Loire" />
            <button type="button" onclick="filterLocationsByRegion();">Filtrer par région</button>
        </div>

        <div>
            <h1>Lieux enregistrés</h1>
            <ul id="savedLocationsList"></ul>
            <div id="savedLocationWeather"></div>
        </div>
    </body>
</html>
